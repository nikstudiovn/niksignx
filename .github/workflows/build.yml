name: Build NiKSign IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build unsigned IPA via makefile
        run: |
          make
          cp packages/Ksign.ipa packages/NiKSign-unsigned.ipa

      - name: Upload NiKSign IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiKSign-unsigned-ipa
          path: packages/NiKSign-unsigned.ipa

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/NiKSign-unsigned.ipa
